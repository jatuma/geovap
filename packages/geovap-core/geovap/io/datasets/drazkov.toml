# Dražkov dataset descriptor: posed Ladybug equirectangular panoramas + tiled MLS LAZ ground
# points + JVF/ZPS reference vectors. Values ported from `mapping/config.py`, which used to freeze
# them as module-level constants at import time.
name = "drazkov"

[paths]
data_root = "${GEOVAP_DATA}"
workspace = "${GEOVAP_WORKSPACE}"
publish   = "${GEOVAP_PUBLISH}"

[crs]
epsg = 5514
proj4 = "+proj=krovak +lat_0=49.5 +lon_0=24.8333333333333 +alpha=30.2881397527778 +k=0.9999 +x_0=0 +y_0=0 +ellps=bessel +towgs84=589,76,480,0,0,0,0 +units=m +no_defs +type=crs"

[poses]
adapter = "ladybug_export_csv"
file = "LB5, Camera Ladybug/export.csv"
columns = { t = 0, file = 1, e = 2, n = 3, h = 4, roll = 11, pitch = 12, yaw = 13 }
expect_columns = 17

[panos]
adapter = "equirect_dir"
dir = "LB5, Camera Ladybug"
width = 8000
height = 4000

[tiles]
adapter = "laz_dir"
dir = "LAZ_Dražkov_ground"
glob = "*.laz"
# Capture the tile number WITH its zero padding: the legacy pipeline used
# `stem.split("_")[1][-3:]`, i.e. the last three digits, and `out_name` below reproduces the
# filenames it wrote. A pattern that strips the padding (`0*(?P<id>\d+)`) silently renames every
# tile -- ID3432_0001.laz instead of ID3432_000001.laz -- which no test would have caught.
id_regex = 'ID\d+_\d*(?P<id>\d{3})_JTSK\.laz'
out_name = "ID3432_000{id}{kind}.laz"
grid = "Klad_LAZ_Dražkov.geojson"

# Products whose filename is not `out_name` plus a suffix. The clustering stage is developed
# independently of the rest (it imports no project code at all) and names its output with its
# own prefix; naming it here keeps that literal out of the stage.
[tiles.names]
cluster        = "objects_t000{id}.laz"
cluster_rgb    = "rgb_t000{id}.laz"

[reference]
adapter = "jvf_zps"
file = "1_ZPS_GAD.geojson"
codes = "jvf_zps_cz.toml"

[sensor]
pano_w = 8000
pano_h = 4000
zb_w = 2000
zb_h = 1000
r_min = 1.0
r_max = 40.0
point_spacing = 0.051
cell_size = 4.0
tol_abs = 0.15
tol_rel = 0.03
splat_k = 1.2
splat_min_px = 1
splat_max_px = 8

[tuning]
score_r0 = 8.0
incidence_max_deg = 80.0
top_k = 5
mad_cutoff = 2.5
