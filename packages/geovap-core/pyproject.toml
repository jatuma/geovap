[project]
name = "geovap-core"
version = "0.1.0"
description = "Geovap foundation: domain model and math, dataset adapters, runtime artifacts, and the stages that need nothing beyond numpy/laspy."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0,<2.3",
    "numba>=0.60",
    "scipy>=1.13",
    "laspy[lazrs]>=2.5",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
turbo = ["PyTurboJPEG>=1.7"]
# domain/math/camera_torch.py is an independent reference implementation used by tests
torch = ["torch>=2.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["geovap"]
