[project]
name = "geovap-app"
version = "0.1.0"
description = "Geovap command line: dataset doctor, pipeline driver, descriptor profiles."
requires-python = ">=3.11,<3.12"
dependencies = ["geovap-core"]

[project.scripts]
geovap = "geovap.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["geovap"]
