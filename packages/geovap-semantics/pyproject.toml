[project]
name = "geovap-semantics"
version = "0.1.0"
description = "Geovap semantics: JVF pseudo-ground-truth, zero-shot panorama segmentation, and projection of masks onto the point cloud."
requires-python = ">=3.11,<3.12"
dependencies = [
    "geovap-core",
    "torch>=2.6",
    "transformers>=5.0",
    "shapely>=2.0",
    "huggingface-hub>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["geovap"]
