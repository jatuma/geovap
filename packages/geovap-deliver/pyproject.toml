[project]
name = "geovap-deliver"
version = "0.1.0"
description = "Geovap delivery: the consolidated one-LAZ-per-tile product, Potree octree publishing, viewer and container infrastructure."
requires-python = ">=3.11,<3.12"
dependencies = ["geovap-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["geovap"]
# `geovap/infra` is Dockerfiles, an nginx config and viewer HTML -- not Python, and hatchling would
# drop them from the wheel. They ship because `geovap publish` builds the octree and serves the
# viewer from them; a delivery install without them can convert nothing.
artifacts = [
    "geovap/infra/containers/*",
    "geovap/infra/viewer/**/*",
    "geovap/infra/shots/*",
]
