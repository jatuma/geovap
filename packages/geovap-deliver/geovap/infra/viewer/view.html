<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Potree Viewer</title>
	<link rel="stylesheet" type="text/css" href="./build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="./libs/jstree/themes/mixed/style.css">
	<style>
		body { margin: 0; padding: 0; overflow: hidden; }
		#panos_panel {
			position: absolute; left: 10px; bottom: 10px; z-index: 10000; display: none;
			background: rgba(20,20,20,0.85); color: #eee; font: 12px sans-serif;
			padding: 8px 10px; border-radius: 4px; width: 210px;
		}
		#panos_panel h4 { margin: 0 0 6px 0; font-size: 12px; font-weight: bold; }
		#panos_panel label { display: block; margin: 6px 0 2px 0; }
		#panos_panel input[type=range] { width: 100%; }
		#panos_panel .row { display: flex; gap: 4px; margin-top: 6px; }
		#panos_panel button { flex: 1; cursor: pointer; }
		#panos_panel .hint { color: #999; margin-top: 6px; line-height: 1.4; }
	</style>
	<script>
		// The CRS comes from `crs.json`, written next to the octree by the publish stage from the
		// dataset's own `[crs]` table. A hardcoded `proj4.defs(...)` here was EPSG:5514 -- correct
		// for one dataset and silently wrong for any other, since Potree would happily display
		// coordinates under the wrong projection without complaining.
		(function () {
			var req = new XMLHttpRequest();
			req.open("GET", "crs.json", false);  // sync: proj4 must be defined before the GUI builds
			try {
				req.send(null);
				if (req.status === 200) {
					var crs = JSON.parse(req.responseText);
					if (crs.proj4) proj4.defs("EPSG:" + crs.epsg, crs.proj4);
					if (crs.name) document.title = crs.name + " \u2013 cloud";
				}
			} catch (e) { console.warn("crs.json not available; falling back to the page default", e); }
		})();
	</script>
</head>
<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./build/potree/potree.js"></script>
	<script src="./libs/plasio/js/laslaz.js"></script>

	<div id="panos_panel">
		<h4>360&deg; panoramas</h4>
		<div id="panos_current">click a sphere to enter</div>
		<label>photo opacity: <span id="panos_opacity_val">0.50</span></label>
		<input id="panos_opacity" type="range" min="0" max="1" step="0.02" value="0.5">
		<label>sphere radius: <span id="panos_radius_val">1000</span> m</label>
		<input id="panos_radius" type="range" min="5" max="1000" step="5" value="1000">
		<label><input id="panos_depth" type="checkbox"> photo behind the cloud (depth test)</label>
		<div class="row">
			<button id="panos_prev">&larr; prev</button>
			<button id="panos_blink">blink</button>
			<button id="panos_next">next &rarr;</button>
		</div>
		<div class="hint">keys: [ ] frame, B blink, Esc unfocus</div>
	</div>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
		<div id="potree_render_area" style="background-image: url('./build/potree/resources/images/background.jpg')"></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<script>
		// S-JTSK / Krovak East North: PotreeConverter stamps EPSG:5514 into metadata.json and Potree
		// hands it to proj4 for the map overlay; proj4 only knows EPSG:4326/3857 out of the box.

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(2_000_000);
		viewer.loadSettingsFromURL();
		viewer.setDescription("");

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
		});

		function getParam(name) {
			const params = new URLSearchParams(window.location.search);
			return params.get(name);
		}

		// ----------------------------------------------------------------- 360 panoramas
		// <cloud dir>/panos/ (built by `python -m mapping.cli.export_panos`) holds Potree's own
		// coordinates.txt + one jpg per frame. Overridable with ?panos=<dir>.
		// Two deviations from stock Potree.Images360, both needed to compare photo against cloud:
		//  * its loader sets texture.repeat.x = -1. That is CORRECT for our panoramas: a normal photo
		//    (lettering readable) on the inside of a three.js sphere is mirrored, and -1 undoes it.
		//    Verified 2026-09-16 on the "VMX-2HA" lettering. ?flip=1 forces +1 (mirrored, A/B only);
		//    the sphere angles come from mapping/panos.py, whose POTREE_M is derived for this
		//    default repeat.x = -1 (see its module docstring and tests/test_panos.py). Keep in sync.
		//  * the sphere is opaque and 1000 m wide, which hides the cloud completely; we clone the
		//    material (Potree shares one instance with the marker spheres) and make it blendable.
		function loadPanos(dir) {
			return fetch(dir + "/coordinates.txt", { method: "HEAD" }).then(r => {
				if (!r.ok) return null;
				return Potree.Images360Loader.load(dir, viewer).then(images => {
					// Potree's MapView (loaded with the GUI) listens to this event and calls this.toMap.forward,
					// which is undefined when the octree carries no CRS (our LAS writer copies no CRS VLR ->
					// metadata.json projection ""). The images are already pushed into the scene before the
					// event fires, so swallow the map-view failure instead of aborting everything below
					// (texture un-mirroring, blendable material, panel) -- exactly the failure that left the
					// spheres MIRRORED in every interactive session before 2026-09-16.
					try {
						viewer.scene.add360Images(images);
					} catch (err) {
						if (!viewer.scene.images360.includes(images)) viewer.scene.images360.push(images);
						console.warn("add360Images: map view rejected the spheres (no CRS on the octree); continuing without map markers:", err.message);
					}

					const rawLoad = images.load.bind(images);
					images.load = img => rawLoad(img).then(v => {
						if (img.texture && getParam("flip") === "1") { img.texture.repeat.x = 1; img.texture.needsUpdate = true; }
						return v;
					});

					const mat = images.sphere.material.clone();
					mat.transparent = true;
					mat.depthWrite = false;
					mat.depthTest = false;
					images.sphere.material = mat;
					images.sphere.renderOrder = 1000;

					const el = id => document.getElementById(id);
					const panel = el("panos_panel");
					panel.style.display = "block";

					const applyOpacity = () => {
						const a = parseFloat(el("panos_opacity").value);
						mat.opacity = a;
						el("panos_opacity_val").textContent = a.toFixed(2);
					};
					const applyRadius = () => {
						const r = parseFloat(el("panos_radius").value);
						images.sphere.scale.set(r, r, r);
						el("panos_radius_val").textContent = r;
					};
					el("panos_opacity").addEventListener("input", applyOpacity);
					el("panos_radius").addEventListener("input", applyRadius);
					el("panos_depth").addEventListener("change", e => { mat.depthTest = e.target.checked; });
					applyOpacity();
					applyRadius();

					// index of the focused image, so [ ] can walk the pass in capture order
					const indexOf = img => images.images.indexOf(img);
					const show = i => {
						const n = images.images.length;
						const img = images.images[((i % n) + n) % n];
						images.focus(img);
						el("panos_current").textContent = img.file.substring(img.file.lastIndexOf("/") + 1)
							+ "  (" + (indexOf(img) + 1) + "/" + n + ")";
					};
					const step = d => {
						const cur = images.focusedImage;
						show(cur ? indexOf(cur) + d : 0);
					};
					let blinkSaved = null;
					const blink = () => {
						if (blinkSaved === null) { blinkSaved = mat.opacity; mat.opacity = mat.opacity > 0.5 ? 0 : 1; }
						else { mat.opacity = blinkSaved; blinkSaved = null; }
					};
					el("panos_prev").addEventListener("click", () => step(-1));
					el("panos_next").addEventListener("click", () => step(+1));
					el("panos_blink").addEventListener("click", blink);
					document.addEventListener("keydown", e => {
						if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
						if (e.key === "[") step(-1);
						else if (e.key === "]") step(+1);
						else if (e.key === "b" || e.key === "B") blink();
						else if (e.key === "Escape") images.unfocus();
					});

					console.log("360 panoramas: " + images.images.length + " from " + dir);
					return images;
				});
			}).catch(err => { console.warn("panos not loaded:", err); return null; });
		}

		const cloudPath = getParam("cloud");
		if (!cloudPath) {
			document.getElementById("potree_render_area").innerHTML =
				"<h2 style='color:white;padding:2em;'>No point cloud specified. Use ?cloud=&lt;folder&gt;/metadata.json (see index.html)</h2>";
		} else {
			// A folder with its own page (e.g. /pointclouds/clusters/) has no metadata.json
			// at the top level: send the visitor to that page instead of a broken viewer.
			fetch(cloudPath, { method: "HEAD" }).then(r => {
				if (r.ok) return;
				const dir = cloudPath.substring(0, cloudPath.lastIndexOf("/"));
				return fetch(dir + "/index.html", { method: "HEAD" }).then(r2 => {
					if (r2.ok) window.location.replace(dir + "/index.html");
				});
			}).catch(() => {});
			Potree.loadPointCloud(cloudPath, "pointcloud", e => {
				let scene = viewer.scene;
				scene.addPointCloud(e.pointcloud);

				let material = e.pointcloud.material;
				material.size = 1;
				material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
				material.shape = Potree.PointShape.SQUARE;

				// If the file has an existing classification, show it by
				// default - this is a common way to inspect ground/veg/etc.
				// Potree 1.8 lists the attributes on the geometry, not on the material.
				const attrs = (e.pointcloud.pcoGeometry && e.pointcloud.pcoGeometry.pointAttributes && e.pointcloud.pcoGeometry.pointAttributes.attributes) || [];
				const hasClassification = attrs.some(a => a.name === "classification");
				if (hasClassification) {
					material.activeAttributeName = "classification";
				}

				// Optional per-cloud class palette: <cloud dir>/classes.json
				// { "classes": { "<id>": { "name": "...", "color": [r,g,b,a 0-255], "visible": true }, "DEFAULT": {...} } }
				const dir = cloudPath.substring(0, cloudPath.lastIndexOf("/"));
				fetch(dir + "/classes.json").then(r => r.ok ? r.json() : null).then(spec => {
					if (!spec || !spec.classes) return;
					const cls = {};
					for (const [id, c] of Object.entries(spec.classes)) {
						const col = (c.color || [0, 0, 0, 255]).map(x => x / 255);
						while (col.length < 4) col.push(1);
						cls[id] = { visible: c.visible !== false, name: c.name || id, color: col };
					}
					viewer.setClassifications(cls);
					if (hasClassification) material.activeAttributeName = "classification";
				}).catch(err => console.warn("classes.json not applied:", err));

				loadPanos(getParam("panos") || (dir + "/panos"));

				viewer.fitToScreen();
			});
		}
	</script>
</body>
</html>
