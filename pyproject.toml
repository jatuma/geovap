# One package, one command. The subpackage tree under `src/geovap/` is the map of who owns what
# (see `CODEOWNERS` and the docstring of `src/geovap/__init__.py`).
#
# `pip install geovap` gives a working doctor, point store, products, colourisation and delivery
# with no torch anywhere in the tree; `pip install "geovap[semantics]"` adds the segmentation stages.
[project]
name = "geovap"
version = "0.1.0"
description = "Posed panoramas + tiled point clouds in, one coloured, semantically labelled cloud per tile out; served through Potree."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0,<2.3",
    "numba>=0.60",
    "scipy>=1.13",
    "laspy[lazrs]>=2.5",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# The segmentation stages (stages/semantics) and domain/math/camera_torch.py, the independent
# reference camera used by tests.
semantics = [
    "torch>=2.6",
    "transformers>=5.0",
    "shapely>=2.0",
    "huggingface-hub>=0.25",
]
turbo = ["PyTurboJPEG>=1.7"]

[project.scripts]
geovap = "geovap.app.cli:main"

[dependency-groups]
# `uv sync` installs the project plus everything the tests exercise.
dev = ["geovap[semantics,turbo]", "pytest>=8", "import-linter>=2.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Non-Python files under the package (descriptor/taxonomy TOMLs, `infra/` Dockerfiles, nginx config
# and viewer HTML) ship in the wheel: `geovap publish` builds the octree and serves the viewer from
# them, and the adapters load the TOMLs at runtime.
[tool.hatch.build.targets.wheel]
packages = ["src/geovap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root on sys.path, so `tests.io.conftest`'s synthetic-dataset fixtures can be
# imported by the other test packages.
pythonpath = ["."]
markers = ["slow: needs the full dataset / long runtime"]
addopts = "-m 'not slow'"
