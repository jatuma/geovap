# The workspace root. It is NOT a package: `mapping/` is gone and nothing lives here but the
# workspace definition, the shared dev dependencies and the tool configuration. Everything that
# ships is under `packages/`.
#
#   geovap-core       domain, io, runtime, and the stages that need no GPU
#   geovap-semantics  the segmentation stages (torch, transformers)
#   geovap-deliver    the consolidated product, the octree and the viewer infrastructure
#   geovap-app        the `geovap` command
#
# Install just what you need: `uv pip install geovap-core` gives a working doctor, store, products
# and colourisation with no torch anywhere in the tree.
[project]
name = "geovap-workspace"
version = "0.1.0"
description = "Development workspace for the geovap distributions. Installs all four, editable."
requires-python = ">=3.11,<3.12"
dependencies = [
    "geovap-core",
    "geovap-semantics",
    "geovap-deliver",
    "geovap-app",
]

[project.optional-dependencies]
turbo = ["geovap-core[turbo]"]

[dependency-groups]
dev = ["pytest>=8", "import-linter>=2.0"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
package = true

[tool.uv.sources]
geovap-core = { workspace = true }
geovap-semantics = { workspace = true }
geovap-deliver = { workspace = true }
geovap-app = { workspace = true }
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Nothing to build here: the root is a workspace, not a distribution.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repository root on sys.path, so `tests.io.conftest`'s synthetic-dataset fixtures can be
# imported by the other test packages. It used to arrive by accident, via the editable install of
# the root `mapping` package; the root is a workspace now and installs nothing.
pythonpath = ["."]
markers = ["slow: needs the full dataset / long runtime"]
addopts = "-m 'not slow'"

[tool.pyright]
# The four distributions each contribute to the same `geovap` PEP 420 namespace. They are installed
# editable, so imports resolve at runtime, but an editor that only looks at the source tree needs to
# be told where the roots are -- otherwise every `from geovap.domain...` is flagged unresolved.
extraPaths = [
    "packages/geovap-core",
    "packages/geovap-semantics",
    "packages/geovap-deliver",
    "packages/geovap-app",
]
