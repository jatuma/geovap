[project]
name = "geovap-legacy"
version = "0.1.0"
description = "Transitional home for `mapping/` while it is split into packages/geovap-*. Deleted in Phase 2."
requires-python = ">=3.11,<3.12"
dependencies = [
    "geovap-core",
    "geovap-semantics",
    "geovap-deliver",
    "geovap-app",
    # still used by the not-yet-migrated modules under mapping/
    "numpy>=2.0,<2.3",
    "numba>=0.60",
    "scipy>=1.13",
    "laspy[lazrs]>=2.5",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "torch>=2.6",
    "transformers>=5.0",
    "shapely>=2.0",
    "huggingface-hub>=0.25",
]

[project.optional-dependencies]
turbo = ["PyTurboJPEG>=1.7"]

[dependency-groups]
dev = ["pytest>=8", "import-linter>=2.0"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
package = true

[tool.uv.sources]
geovap-core = { workspace = true }
geovap-semantics = { workspace = true }
geovap-deliver = { workspace = true }
geovap-app = { workspace = true }
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mapping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the full dataset / long runtime"]
addopts = "-m 'not slow'"
