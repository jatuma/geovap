[project]
name = "geovap-mapping"
version = "0.1.0"
description = "Bidirectional mapping between Ladybug equirectangular panoramas and MLS point clouds (Drazkov)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0,<2.3",
    "numba>=0.60",
    "scipy>=1.13",
    "laspy[lazrs]>=2.5",
    "scikit-image>=0.24",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "torch>=2.6",
]

[project.optional-dependencies]
turbo = ["PyTurboJPEG>=1.7"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mapping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the full dataset / long runtime"]
addopts = "-m 'not slow'"
